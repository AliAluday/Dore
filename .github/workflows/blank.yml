name: Build Dori User & Control Android APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Dori User & Control APKs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: 'basic'

      - name: Prepare wrapper, keystore, Firebase config, and SDK environment
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          rm -f local.properties
          chmod +x gradlew

          # 1. Decode and validate debug.keystore (immune to CRLF/whitespace)
          rm -f debug.keystore
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "Generating fresh debug.keystore..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Ensure Firebase google-services.json exists for both :app and :controlapp
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            if [ ! -s app/google-services.json ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            fi
            if [ ! -s controlapp/google-services.json ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > controlapp/google-services.json
            fi
          fi
          if [ -s app/google-services.json ] && [ ! -s controlapp/google-services.json ]; then
            cp app/google-services.json controlapp/google-services.json
          elif [ -s controlapp/google-services.json ] && [ ! -s app/google-services.json ]; then
            cp controlapp/google-services.json app/google-services.json
          fi
          for gs_file in app/google-services.json controlapp/google-services.json; do
            if [ ! -s "$gs_file" ]; then
              echo "::error::Missing $gs_file. Commit google-services.json or set GOOGLE_SERVICES_JSON_BASE64 secret."
              exit 1
            fi
            python3 -m json.tool "$gs_file" >/dev/null
          done

          # 3. Verify Android SDK 36 & Build-Tools 36.0.0
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          if [ -d "$SDK_DIR/platforms/android-36.0" ] && [ ! -e "$SDK_DIR/platforms/android-36" ]; then
            ln -s "$SDK_DIR/platforms/android-36.0" "$SDK_DIR/platforms/android-36"
          fi

          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
            if [ ! -f "$SDK_DIR/platforms/android-36/android.jar" ] || [ ! -d "$SDK_DIR/build-tools/36.0.0" ]; then
              yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            fi
            set -o pipefail
          fi

          if [ ! -f "$SDK_DIR/platforms/android-36/android.jar" ] || [ ! -d "$SDK_DIR/build-tools/36.0.0" ]; then
            echo "::error::Android SDK 36 or build-tools 36.0.0 is missing in $SDK_DIR"
            ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools" 2>&1 || true
            exit 1
          fi

          echo "SDK verified at $SDK_DIR (android-36 & build-tools 36.0.0 ready)"
          free -h || true

      - name: Build User (:app) & Control (:controlapp) Debug APKs
        shell: bash
        env:
          # Keep Gradle wrapper client lightweight so memory goes to the single daemon JVM
          GRADLE_OPTS: "-Xmx512m -Dfile.encoding=UTF-8"
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :controlapp:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            -Dkotlin.compiler.execution.strategy=in-process \
            --no-parallel \
            --no-configuration-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee gradle-build.log

      - name: Print Gradle failure details
        if: failure()
        shell: bash
        run: |
          echo "=== GRADLE FAILURE SUMMARY ==="
          if [ -f gradle-build.log ]; then
            echo "--- Failed Tasks & Root Causes ---"
            grep -nE "> Task .* FAILED|FAILURE:|What went wrong:|Execution failed|OutOfMemoryError|ERROR:" gradle-build.log | head -n 40 || true
            echo "--- Last Caused By Lines ---"
            grep -nE "Caused by:" gradle-build.log | tail -n 30 || true
            echo "--- FAILURE BLOCK ---"
            awk '/FAILURE: Build failed/{flag=1} flag{print; count++} count>80{exit}' gradle-build.log || true

            {
              echo "## Gradle Build Failure Log"
              echo '```text'
              grep -E "> Task .* FAILED|FAILURE:|What went wrong:|Execution failed|OutOfMemoryError|ERROR:" gradle-build.log | head -n 40 || true
              echo "--- LAST CAUSED BY ---"
              grep -E "Caused by:" gradle-build.log | tail -n 30 || true
              echo "--- FAILURE BLOCK ---"
              awk '/FAILURE: Build failed/{flag=1} flag{print; count++} count>80{exit}' gradle-build.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gradle-build.log not found." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-failure-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package User and Control APKs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s controlapp/build/outputs/apk/debug/controlapp-debug.apk
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Dori-User-Android.apk
          cp controlapp/build/outputs/apk/debug/controlapp-debug.apk dist-apk/Dori-Control-Android.apk
          ls -lh dist-apk/

      - name: Upload Both APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Dori-Dual-Android-APKs
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
