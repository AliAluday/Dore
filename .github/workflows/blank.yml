name: Build Dori User & Control Android APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Dori User & Control APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android signing & SDK licenses
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Both User & Control Debug APKs
        run: gradle :app:assembleDebug :controlapp:assembleDebug --no-daemon --stacktrace

      - name: Package User and Control APKs
        shell: bash
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Dori-User-Android.apk
          cp controlapp/build/outputs/apk/debug/controlapp-debug.apk dist-apk/Dori-Control-Android.apk

      - name: Upload Both APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Dori-Dual-Android-APKs
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30
